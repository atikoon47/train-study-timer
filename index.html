<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="ตัวจับเวลาอ่านหนังสือแบบนั่งรถไฟ เลือกต้นทาง ปลายทาง ฉีกตั๋ว แล้วอ่านจนรถถึงสถานี">
  <meta name="theme-color" content="#0e1116">
  <title>ตั๋วอ่านหนังสือ</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/scene.css">
</head>
<body data-screen="plan">
  <div id="map" class="map" aria-label="แผนที่เส้นทางรถไฟ"></div>
  <div id="window" class="window" hidden><div id="scene" class="scene" aria-hidden="true"></div></div>

  <div id="station-pop" class="station-pop" aria-live="polite" hidden></div>

  <header class="topbar">
    <span class="wordmark">ตั๋วอ่านหนังสือ</span>
    <div class="topbar-actions">
      <button id="btn-sound" class="glass-btn" type="button" aria-pressed="true" aria-label="ปิดเสียง">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.4 6a9 9 0 0 1 0 12"/><path class="slash" d="M16 9l5 6M21 9l-5 6"/></svg>
      </button>
      <button id="btn-log" class="glass-btn" type="button" aria-label="สมุดเดินทาง">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg>
      </button>
    </div>
  </header>

  <!-- วางแผนเที่ยว -->
  <section id="panel-plan" class="sheet-panel" aria-label="วางแผนการเดินทาง">
    <div class="od">
      <button id="btn-from" class="od-row" type="button">
        <span class="od-dot from" aria-hidden="true"></span>
        <span class="od-k">ต้นทาง</span>
        <span class="od-v" id="from-v"></span>
        <span class="od-code" id="from-code"></span>
      </button>
      <button id="btn-to" class="od-row" type="button">
        <span class="od-dot to" aria-hidden="true"></span>
        <span class="od-k">ปลายทาง</span>
        <span class="od-v" id="to-v"></span>
        <span class="od-code" id="to-code"></span>
      </button>
      <button id="btn-swap" class="swap" type="button" aria-label="สลับต้นทางกับปลายทาง">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v16M8 20l-4-4M8 20l4-4M16 20V4M16 4l-4 4M16 4l4 4"/></svg>
      </button>
    </div>
    <p id="pick-hint" class="hint">แตะสถานีบนแผนที่เพื่อเลือกปลายทาง</p>

    <div id="trip-plan" hidden>
      <div class="route-meta"><span id="route-meta"></span><button id="btn-clear" class="chip" type="button">ล้างปลายทาง</button></div>
      <div id="services" class="services" role="radiogroup" aria-label="เลือกขบวน"></div>
      <p id="long-note" class="hint warn" hidden></p>
      <label class="field">
        <span>อ่านอะไรเที่ยวนี้</span>
        <input id="input-subject" type="text" maxlength="40" placeholder="เช่น ชีววิทยา บทที่ 3" autocomplete="off">
      </label>
      <button id="btn-issue" class="btn-primary" type="button">ออกตั๋ว</button>
    </div>
  </section>

  <!-- ระหว่างเดินทาง -->
  <section id="panel-ride" class="sheet-panel hud" aria-label="ระหว่างเดินทาง" hidden>
    <div class="hud-top">
      <span id="hud-train" class="hud-train"></span>
      <button id="btn-view" class="chip" type="button" aria-pressed="false">วิวหน้าต่าง</button>
    </div>
    <div id="hud-time" class="hud-time" role="timer" aria-live="off">00:00</div>
    <div id="hud-subject" class="hud-subject"></div>
    <div class="hud-track">
      <span id="hud-from" class="code"></span>
      <div class="progress" aria-hidden="true"><div id="hud-bar" class="progress-bar"></div><div id="hud-ticks"></div></div>
      <span id="hud-to" class="code"></span>
    </div>
    <p id="hud-next" class="hud-next" aria-live="polite"></p>
    <div class="hud-actions">
      <button id="btn-recenter" class="chip" type="button">กลับไปที่ขบวนรถ</button>
      <button id="btn-alight" class="btn-quiet" type="button">ลงกลางทาง</button>
    </div>
  </section>

  <!-- ถึงสถานี -->
  <section id="panel-arrive" class="sheet-panel" aria-label="ถึงสถานี" hidden>
    <p id="arrive-lead" class="arrive-lead"></p>
    <div id="arrive-sign" class="arrive-sign"></div>
    <div id="arrive-ticket" class="arrive-ticket"></div>
    <dl id="arrive-stats" class="stats"></dl>
    <button id="btn-again" class="btn-primary" type="button">วางแผนเที่ยวต่อไป</button>
  </section>

  <!-- ตั๋ว -->
  <dialog id="dlg-ticket" class="ticket-view" aria-labelledby="ticket-title">
    <div class="tv-inner">
      <div class="tv-head">
        <h2 id="ticket-title">ตั๋วของคุณ</h2>
        <button class="chip" type="button" data-close>ยกเลิก</button>
      </div>
      <div id="ticket-slot" class="ticket-slot"></div>
      <button id="btn-tear" class="btn-primary" type="button">ฉีกตั๋ว ออกเดินทาง</button>
      <p class="hint center">หรือลากส่วนล่างของตั๋วลงเพื่อฉีก</p>
    </div>
  </dialog>

  <!-- เลือกสถานี -->
  <dialog id="dlg-stations" class="glass-sheet" aria-labelledby="stations-title">
    <div class="sheet-head">
      <h2 id="stations-title"></h2>
      <button class="glass-btn" type="button" data-close aria-label="ปิด"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <input id="station-search" class="search" type="search" placeholder="ค้นหาชื่อสถานี" autocomplete="off">
    <div id="station-list" class="station-list"></div>
  </dialog>

  <!-- ยืนยันลงกลางทาง -->
  <dialog id="dlg-alight" class="glass-sheet small" aria-labelledby="alight-title">
    <h2 id="alight-title">ลงที่สถานีล่าสุดที่ผ่านมา?</h2>
    <p id="alight-body"></p>
    <div class="sheet-actions">
      <button class="btn-quiet" type="button" data-close>นั่งต่อ</button>
      <button id="btn-alight-confirm" class="btn-danger" type="button">ลงจากรถ</button>
    </div>
  </dialog>

  <!-- สมุดเดินทาง -->
  <dialog id="dlg-log" class="glass-sheet" aria-labelledby="log-title">
    <div class="sheet-head">
      <h2 id="log-title">สมุดเดินทาง</h2>
      <button class="glass-btn" type="button" data-close aria-label="ปิด"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <dl id="log-stats" class="stats two"></dl>
    <ol id="log-trips" class="log-trips"></ol>
    <button id="btn-reset" class="link-btn danger" type="button">ลบประวัติทั้งหมด</button>
  </dialog>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="js/rail.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/ticket.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
